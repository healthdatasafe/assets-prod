  All rights reserved.

  This material is the production build of a Health Data Safe service, served
  to its users and clients. Serving it grants no licence beyond the following.
  You may load and use this material as served, to use or interoperate with
  Health Data Safe. You may also inspect and test it to verify how it handles
  your data, and to report vulnerabilities to Health Data Safe
  (https://www.healthdatasafe.org/.well-known/security.txt). No other right to
  use, copy, modify, merge, publish, distribute, sublicense or sell it, in
  whole or in part, is granted without the prior written permission of Health
  Data Safe. Persons working with Health Data Safe under a written agreement
  may use this material as that agreement provides. Permission requests:
  contact@healthdatasafe.org.

  Third-party components included in this material remain under their own
  licences (see NOTICE where present).

substitutions:
  YEARS:
    start: 2026
    end: CURRENT_YEAR
  AUTHOR_NAME: Health Data Safe
  AUTHOR_WEB: https://www.healthdatasafe.org
  SPDX: UNLICENSED
  README_LICENSE: "Health Data Safe material: proprietary, all rights reserved; served to be used as is, and you may inspect it (see [LICENSE](LICENSE)). Pryv-derived files: see [NOTICE](NOTICE)."
